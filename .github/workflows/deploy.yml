name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from a subpath, so assets must resolve there.
          VITE_BASE_PATH: /episode-tier-ranker/
          # Baked into the public bundle so visitors don't need their own key.
          # This is a deliberate trade-off: the key is extractable from the
          # site's JS, but it's a free personal-use key. Settings still lets a
          # visitor override it with their own.
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
